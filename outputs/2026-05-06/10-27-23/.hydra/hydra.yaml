hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - video_path=/root/.cache/asl/0043626-2023.1.4.mp4
    - preprocessing.detector_path=sign_language_translation/ssvp_slt/examples/sonar/mmod_human_face_detector.dat
    - feature_extraction.pretrained_model_path=/root/.cache/asl/dm_70h_ub_signhiera.pth
    - translation.pretrained_model_path=/root/.cache/asl/dm_70h_ub_sonar_encoder.pth
    - translation.tgt_langs=[eng_Latn]
  job:
    name: run
    chdir: null
    override_dirname: feature_extraction.pretrained_model_path=/root/.cache/asl/dm_70h_ub_signhiera.pth,preprocessing.detector_path=sign_language_translation/ssvp_slt/examples/sonar/mmod_human_face_detector.dat,translation.pretrained_model_path=/root/.cache/asl/dm_70h_ub_sonar_encoder.pth,translation.tgt_langs=[eng_Latn],video_path=/root/.cache/asl/0043626-2023.1.4.mp4
    id: ???
    num: ???
    config_name: run_config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /root/sign_language_to_expressive_speech
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /root/sign_language_to_expressive_speech/sign_language_translation/ssvp_slt/examples/sonar
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /root/sign_language_to_expressive_speech/outputs/2026-05-06/10-27-23
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
